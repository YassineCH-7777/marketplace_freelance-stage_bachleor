spring.application.name=marketplace-freelance

# Load local environment variables when running the backend outside Docker.
# Supports running from backend/ or from the project root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]

# PostgreSQL configuration for local development (read from env or use defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketplace_freelance?createDatabaseIfNotExist=true}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Optional database initialization. Keep disabled by default and enable only once
# during deployment with SPRING_SQL_INIT_MODE=always.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8

# JWT Secret config. Set JWT_SECRET in your local .env or deployment environment.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:${PORT:8080}}

# Public frontend URL used in verification and reset links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Firebase Auth verifies email/password users and sends account-management emails.
firebase.project-id=${FIREBASE_PROJECT_ID:}

# Google Identity Services direct login. This is separate from Firebase Google provider.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:${VITE_GOOGLE_CLIENT_ID:}}

# CORS origin patterns. Keep this explicit when credentials are enabled.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Uploads: images, PDF, briefs, invoices and delivery proofs
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}


logging.level.org.springframework.security=TRACE